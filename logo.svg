<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#CE1126"/>
      <stop offset="50%"  stop-color="#111111"/>
      <stop offset="100%" stop-color="#007A3D"/>
    </linearGradient>
    <linearGradient id="ballGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e0e0e0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="rgba(0,0,0,0.4)"/>
    </filter>
  </defs>

  <!-- Shield shape -->
  <path d="M100 10 L180 40 L180 115 Q180 165 100 195 Q20 165 20 115 L20 40 Z"
        fill="url(#shieldGrad)" filter="url(#shadow)"/>

  <!-- Shield inner border -->
  <path d="M100 20 L170 46 L170 115 Q170 158 100 185 Q30 158 30 115 L30 46 Z"
        fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="2"/>

  <!-- Jordan flag stripe top (black) -->
  <path d="M30 46 L170 46 L170 76 L30 76 Z" fill="rgba(0,0,0,0.55)" clip-path="url(#shieldClip)"/>

  <!-- Jordan flag stripe mid (white) -->
  <path d="M30 76 L170 76 L170 106 L30 106 Z" fill="rgba(255,255,255,0.12)"/>

  <!-- Jordan flag stripe bottom (green) -->
  <path d="M30 106 L170 106 L170 136 L30 136 Z" fill="rgba(0,122,61,0.55)"/>

  <!-- football (soccer ball) -->
  <circle cx="100" cy="91" r="32" fill="url(#ballGrad)" stroke="rgba(255,255,255,0.6)" stroke-width="1.5"/>

  <!-- Ball hexagonal patches -->
  <polygon points="100,70 111,77 111,91 100,98 89,91 89,77" fill="none" stroke="#333" stroke-width="1.8"/>
  <polygon points="100,55 105,58 100,62 95,58" fill="#222" stroke="#333" stroke-width="1"/>
  <polygon points="118,79 122,84 118,89 113,89 109,84 109,79" fill="#222" stroke="#333" stroke-width="1"/>
  <polygon points="82,79 78,84 82,89 87,89 91,84 91,79" fill="#222" stroke="#333" stroke-width="1"/>
  <polygon points="113,103 118,106 113,110 105,110 101,106 101,103" fill="#222" stroke="#333" stroke-width="1"/>
  <polygon points="87,103 82,106 87,110 95,110 99,106 99,103" fill="#222" stroke="#333" stroke-width="1"/>

  <!-- Star accent top -->
  <polygon points="100,30 102,36 108,36 103,40 105,46 100,42 95,46 97,40 92,36 98,36"
           fill="rgba(255,255,255,0.9)" />

  <!-- Text: JF initials small below star -->
  <text x="100" y="148" font-family="Arial Black, sans-serif" font-size="11" font-weight="900"
        fill="white" text-anchor="middle" letter-spacing="4" opacity="0.95">JORDAN</text>
  <text x="100" y="162" font-family="Arial Black, sans-serif" font-size="8" font-weight="700"
        fill="rgba(255,255,255,0.7)" text-anchor="middle" letter-spacing="3">FOOTBALL</text>

  <!-- Bottom accent red line -->
  <line x1="72" y1="167" x2="128" y2="167" stroke="#CE1126" stroke-width="2" stroke-linecap="round"/>
</svg>
